        try {
          var m = document.cookie.match(/(?:^|;\s*)manos_vid=([^;]*)/);
          if (m) return decodeURIComponent(m[1]);
          var id = (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : "v_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 11);
          document.cookie = "manos_vid=" + encodeURIComponent(id) +
            ";Max-Age=63072000;Path=/;SameSite=Lax" +
            (location.protocol === "https:" ? ";Secure" : "");
          return id;
        } catch (e) { return ""; }
      })();
      window.__manosPixelId = (function () {
        var id = "%VITE_META_PIXEL_ID%";

      })();
      window.__medirEmProducao =
        !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && !/\.local$/.test(location.hostname);
